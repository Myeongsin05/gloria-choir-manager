<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아이디/비밀번호 찾기 · 찬양대 자산실</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="auth-screen">
      <div class="auth-panel">
        <div class="brand auth-brand">
          <div class="brand-mark">찬</div>
          <div>
            <strong>찬양대 자산실</strong>
            <span>계정 복구</span>
          </div>
        </div>
        <h1>아이디/비밀번호 찾기</h1>
        <p>가입된 이메일을 입력하면 해당 이메일로 임시 비밀번호를 전송합니다.</p>

        <form id="resetForm" class="login-form">
          <label>가입 이메일<input name="email" type="email" required placeholder="name@example.com" /></label>
          <button class="primary-button" type="submit">임시 비밀번호 전송</button>
        </form>

        <div class="reset-result hidden" id="resetResult" role="status" aria-live="polite"></div>

        <div class="auth-links">
          <a href="index.html">로그인 화면으로 돌아가기</a>
        </div>

        <div class="demo-accounts">
          <strong>로컬 개발 안내</strong>
          <span>실제 메일 서버가 연결되기 전까지 전송 내역은 data/mail-outbox.json에 저장됩니다.</span>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="forgot-password.js"></script>
  </body>
</html>
